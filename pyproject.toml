[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-intelligence-system"
version = "0.1.0"
description = "An end-to-end voice command, speaker identification, and Whisper transcription demo."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "Flask>=3.1,<4",
  "jiwer>=4,<5",
  "joblib>=1.4,<2",
  "librosa>=0.11,<0.12",
  "numpy>=2.0,<3",
  "openai-whisper>=20250625",
  "scikit-learn>=1.8,<1.9",
  "torch>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["support*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
